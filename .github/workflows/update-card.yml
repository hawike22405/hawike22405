name: Update profile card

on:
  schedule:
    # Runs every 6 hours so the LOC counter and ASCII art stay fresh.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "generate_card.py"
      - "count_loc.py"
      - ".github/workflows/update-card.yml"

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core cloc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Count lines of code across all repos
        run: python count_loc.py

      - name: Generate card
        run: python generate_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg loc-badge.json loc-data.json
          git diff --staged --quiet || git commit -m "chore: auto-update profile card & LOC stats"
          git push

name: Update profile card

on:
  schedule:
    # Runs every 12 hours so the ASCII art stays in sync if you change
    # your GitHub avatar, even without a push.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "generate_card.py"
      - ".github/workflows/update-card.yml"

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system font (DejaVu Sans Mono)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate card
        run: python generate_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg
          git diff --staged --quiet || git commit -m "chore: auto-update profile card"
          git push
